<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Backoffice Auditvorbereitung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Gleiche Farbwelt wie die Kundenseite: Bereiche haben feste Farben, Grün/Gelb/Rot nur für den Stand */
:root{--blau:#1F4E79;--blau2:#2E6DA4;--hell:#EEF4FA;--rand:#D5E1EC;--text:#1B2733;--grau:#5B6B7A;--gruen:#2B8A3E;--gelb:#E0A800;--rot:#C92A2A;
  --violett:#6741D9;--violett-hell:#F3F0FF;--petrol:#0B7285;--petrol-hell:#E3FAFC;--orange:#D9480F;--orange-hell:#FFF4E6;--gelb-dunkel:#B07A00;--f:#1F4E79}
*{box-sizing:border-box}
body{margin:0;font-family:"Public Sans",system-ui,sans-serif;color:var(--text);background:#F6F9FC;font-size:15px;line-height:1.5}
header{background:var(--blau);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:1.15rem}header .grau{color:#C9D8E8}
main{max-width:1180px;margin:0 auto;padding:16px}
h2{color:var(--blau);margin:6px 0 12px;font-size:1.3rem}h3{color:var(--blau);margin:18px 0 8px;font-size:1.05rem}
.karte{background:#fff;border:1px solid var(--rand);border-radius:14px;padding:14px;margin:10px 0}
.zeile{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grau{color:var(--grau);font-size:.9rem}
.knopf{display:inline-block;border:0;border-radius:8px;padding:8px 14px;background:var(--f);color:#fff;font:600 .95rem inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.knopf.zweit{background:#fff;color:var(--f);border:1px solid var(--f)}.knopf.klein{padding:4px 10px;font-size:.85rem}.knopf.rot{background:var(--rot)}
.knopf:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--blau2);text-decoration:underline;cursor:pointer;padding:0;font:inherit}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--rand);border-radius:8px;background:#fff;max-width:100%}
label{display:block;margin:8px 0 4px;font-weight:600}
.hinweis{background:#FFF8E1;border:1px solid #F2D58A;border-radius:10px;padding:10px 12px;margin:10px 0}
.ok-box{background:#E7F5EC;border:1px solid #9FD3B0;border-radius:10px;padding:10px 12px;margin:10px 0}
.fehler{background:#FFE3E3;border:1px solid #F5A3A3;border-radius:10px;padding:10px 12px;margin:10px 0}
.anmelden{max-width:380px;margin:60px auto}
.anmelden input{width:100%}
/* Übersicht: Kennzahlen oben, dann eine Kachel je Kunde */
.kennzahlen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kz{background:#fff;border:1px solid var(--rand);border-radius:14px;padding:12px 14px;border-top:4px solid var(--f)}
.kz .zahl{font-size:1.9rem;font-weight:700;color:var(--f);font-variant-numeric:tabular-nums;line-height:1.1}
.kunden{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.kunde{background:#fff;border:1px solid var(--rand);border-radius:14px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:6px;border-left:6px solid var(--f)}
.kunde:hover{box-shadow:0 6px 16px rgba(20,40,60,.12)}
.kunde .name{font-weight:700;font-size:1.05rem;color:var(--blau)}
.tage{font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--hell);color:var(--blau);font-size:.8rem;font-weight:600}
.chip.orange{background:var(--orange-hell);color:var(--orange)}.chip.violett{background:var(--violett-hell);color:var(--violett)}.chip.rot{background:#FFE3E3;color:var(--rot)}.chip.gruen{background:#D3F9D8;color:#1B5E20}.chip.grau{color:var(--grau);background:#F1F3F5}
.balken{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--rand)}.balken span{display:block;height:100%}
.reiter{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--rand);margin:8px 0 12px}
.reiter button{border:0;background:none;padding:8px 12px;border-radius:8px 8px 0 0;font:600 .95rem inherit;font-family:inherit;color:var(--grau);cursor:pointer}
.reiter button.an{background:var(--f);color:#fff}
table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border-bottom:1px solid var(--rand);padding:6px;text-align:left;vertical-align:top}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:#CBD5E0}.dot.gruen{background:var(--gruen)}.dot.gelb{background:var(--gelb)}.dot.rot{background:var(--rot)}
.korr{background:#FFF3BF}.fein{color:var(--gruen)}img.mini{max-width:200px;border:1px solid var(--rand);border-radius:6px;margin:4px}
.kacheln{display:flex;gap:12px;flex-wrap:wrap}.kachel{background:var(--hell);border-radius:10px;padding:10px 14px;min-width:150px}.zahl{font-size:1.5rem;font-weight:700;color:var(--blau)}
.protokoll{font:.85rem/1.5 ui-monospace,Consolas,monospace;background:#0F1E2D;color:#D6E4F0;border-radius:10px;padding:10px 12px;max-height:280px;overflow:auto;white-space:pre-wrap}
.linkfeld{font:.9rem ui-monospace,Consolas,monospace;width:100%;background:var(--hell)}
.nachricht{border-left:4px solid var(--orange);padding:6px 10px;margin:8px 0;background:var(--orange-hell);border-radius:0 8px 8px 0}
.nachricht.gelesen{border-left-color:var(--rand);background:#fff}
@media (max-width:760px){.kennzahlen{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div><b>Auditvorbereitung · Backoffice</b> <span class="grau">QM-Dienstleistungen</span></div><div class="zeile" id="kopf-rechts"></div></header>
<main id="main"><p class="grau">Einen Moment …</p></main>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module" src="./backoffice.js"></script>
</body>
</html>
