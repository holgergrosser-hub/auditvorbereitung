<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Auswertung Auditvorbereitung</title>
<style>
:root{--blau:#1F4E79;--hell:#EEF4FA;--rand:#D5E1EC;--grau:#5B6B7A;--gruen:#2B8A3E;--gelb:#E0A800;--rot:#C92A2A}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#1B2733;background:#F6F9FC;line-height:1.45}
header{background:var(--blau);color:#fff;padding:14px 16px}header h1{margin:0;font-size:1.3rem}
main{max-width:1100px;margin:0 auto;padding:16px}h2{color:var(--blau);font-size:1.15rem;margin:18px 0 8px}
.karte{background:#fff;border:1px solid var(--rand);border-radius:12px;padding:14px;margin:10px 0;overflow-x:auto}
.grau{color:var(--grau);font-size:.92rem}.knopf{border:0;border-radius:8px;padding:8px 12px;background:var(--blau);color:#fff;font-weight:600;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border-bottom:1px solid var(--rand);padding:4px 6px;text-align:left;vertical-align:top}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:#CBD5E0}.dot.gruen{background:var(--gruen)}.dot.gelb{background:var(--gelb)}.dot.rot{background:var(--rot)}
.korr{background:#FFF3BF}.fein{color:var(--gruen)}img.mini{max-width:200px;border:1px solid var(--rand);border-radius:6px;margin:4px}
.zahl{font-size:1.6rem;font-weight:700;color:var(--blau)}.kacheln{display:flex;gap:12px;flex-wrap:wrap}.kachel{background:var(--hell);border-radius:10px;padding:10px 14px;min-width:150px}
</style>
</head>
<body>
<header><h1>Auswertung Auditvorbereitung</h1><div>Für den Berater: Ergebnis-Dateien der Kunden ansehen. Alles bleibt in diesem Browser.</div></header>
<main>
<div class="karte">
  <p><b>1. Paket</b> <span id="paket-info" class="grau">wird gesucht …</span><br><input type="file" id="paket" accept=".json"></p>
  <p><b>2. Ergebnis-Dateien</b> (vom Kunden per E-Mail): <input type="file" id="ergebnis" accept=".json" multiple></p>
</div>
<div id="aus"></div>
</main>
<script type="module">
import L from '../logik.js';
const $ = (s) => document.querySelector(s); const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let paket = null, ergebnisse = [];
const lies = (f) => new Promise((ok, nein) => { const r = new FileReader(); r.onload = () => { try { ok(JSON.parse(r.result)); } catch (e) { nein(e); } }; r.readAsText(f); });
try { const r = await fetch('../kunde/paket.json', { cache: 'no-store' }); if (r.ok) { paket = await r.json(); } } catch (e) { /* lokal ohne Paket */ }
$('#paket-info').textContent = paket ? '✓ ' + paket.kunde.name + ' (Stand ' + paket.erstellt.slice(0, 10) + ')' : 'bitte paket.json wählen';
$('#paket').onchange = async (e) => { paket = await lies(e.target.files[0]); $('#paket-info').textContent = '✓ ' + paket.kunde.name; zeichne(); };
$('#ergebnis').onchange = async (e) => { ergebnisse = []; for (const f of e.target.files) ergebnisse.push(await lies(f)); zeichne(); };

function zeichne() {
  if (!paket || !ergebnisse.length) return;
  const ma = Object.fromEntries(paket.mitarbeiter.map(m => [m.id, m.name]));
  $('#aus').innerHTML = ergebnisse.map(e => {
    const ein = (art) => (e.eintraege || []).filter(x => x.art === art);
    let html = '<h2>' + esc(e.kunde) + ' · exportiert ' + esc(String(e.exportiert).slice(0, 16).replace('T', ' ')) + '</h2>';
    // Kennzahlen je Audit
    paket.audits.forEach(a => {
      const fr = paket.fragenJe[a.id] || [], an = (e.antworten || []).filter(x => x.audit_id === a.id);
      const fallen = (paket.stolperfallen || []).filter(f => !f.stufe || f.stufe <= a.stufe);
      const spur = L.spurPruefen(ein('spur').map(x => Object.assign({ k: x.schluessel }, x.daten)));
      const r = L.pruefungsreife({ fragen: fr, antworten: an, technik_check: e.technik, faktencheck: e.faktencheck, fallen: fallen.length, fallen_geuebt: fallen.filter(f => ein('falle').some(x => x.schluessel === f.id)).length, spur_stationen: spur.von, spur_fertig: spur.fertig, stufe: a.stufe });
      const leute = [...new Set(an.map(x => x.mitarbeiter_id))].filter(Boolean);
      const m = L.ampelMatrix(fr, an, leute.map(id => ({ id })));
      html += '<div class="karte"><b>Stufe ' + a.stufe + ' · ' + esc(a.datum || 'offen') + '</b><div class="kacheln"><div class="kachel"><div class="zahl">' + r.prozent + ' %</div>Prüfungsreife</div>'
        + r.teile.map(t => '<div class="kachel"><div class="zahl">' + t.prozent + ' %</div>' + esc(t.name) + '</div>').join('') + '</div>'
        + (leute.length ? '<table><tr><th>Punkt</th><th>Frage</th>' + leute.map(id => '<th>' + esc(ma[id] || id) + '</th>').join('') + '</tr>'
          + m.zeilen.filter(z => leute.some(id => z.je[id] !== 'offen')).map(z => '<tr><td>' + esc(z.normkapitel) + '</td><td>' + esc(String(z.frage).slice(0, 90)) + '</td>' + leute.map(id => '<td><span class="dot ' + z.je[id] + '"></span></td>').join('') + '</tr>').join('')
          + '<tr><td></td><td><b>Summe</b> (grün / gelb / rot / offen)</td>' + leute.map(id => { const s = m.summe[id]; return '<td>' + s.gruen + ' / ' + s.gelb + ' / ' + s.rot + ' / ' + s.offen + '</td>'; }).join('') + '</tr></table>' : '<p class="grau">Noch keine Antworten.</p>')
        + '</div>';
    });
    // Fotopruefungen, die nicht passten
    const falsch = (e.antworten || []).filter(x => x.pruefung && x.pruefung.passt !== 'ja');
    if (falsch.length) html += '<div class="karte"><b>Zeig mal: gezeigtes Dokument passte nicht</b><ul>' + falsch.map(x => { const f = Object.values(paket.fragenJe).flat().find(y => y.id === x.frage_id) || {}; return '<li>' + esc(f.normkapitel || '') + ' – ' + esc(x.pruefung.hinweis) + '</li>'; }).join('') + '</ul></div>';
    // Faktencheck
    html += '<div class="karte"><b>Faktencheck</b><table>' + (e.faktencheck || []).map(f => '<tr class="' + (f.antwort === 'stimmt_nicht' ? 'korr' : '') + '"><td>' + esc(f.thema) + '</td><td>' + esc(f.angabe) + '</td><td>' + (f.antwort === 'stimmt' ? '<span class="fein">✓ stimmt</span>' : f.antwort === 'stimmt_nicht' ? '<b>Korrektur:</b> ' + esc(f.korrektur) : '<span class="grau">offen</span>') + '</td></tr>').join('') + '</table></div>';
    // Stolperfallen
    const fa = ein('falle'); if (fa.length) html += '<div class="karte"><b>Stolperfallen</b><table>' + fa.map(x => { const f = (paket.stolperfallen || []).find(y => y.id === x.schluessel) || {}; return '<tr><td>' + esc(f.thema) + '</td><td>' + (x.daten.sicherheit === 'sicher' ? '<span class="fein">sicher</span>' : '<b>unsicher</b>') + '</td><td>' + esc(x.daten.text || '') + '</td></tr>'; }).join('') + '</table></div>';
    // Spur + Rundgang
    const sp = ein('spur'); if (sp.length) { const pr = L.spurPruefen(sp.map(x => Object.assign({ k: x.schluessel }, x.daten))); html += '<div class="karte"><b>Beispielauftrag: ' + pr.fertig + ' von ' + pr.von + ' Stationen</b>' + (pr.hinweise.length ? '<ul>' + pr.hinweise.map(h => '<li>' + esc(h) + '</li>').join('') + '</ul>' : ' – roter Faden hält') + '</div>'; }
    const rg = ein('rundgang'); if (rg.length) html += '<div class="karte"><b>Rundgang</b><table>' + rg.map(x => { const it = (paket.rundgang || []).find(y => y.k === x.schluessel) || {}; const s = L.rundgangStatus(Object.assign({ intervall_monate: it.intervall_monate }, x.daten)); return '<tr><td>' + esc(it.name || x.schluessel) + '</td><td>' + esc(s.status) + '</td><td>' + esc(s.naechste) + '</td><td>' + (x.daten.foto ? '<img class="mini" src="' + x.daten.foto + '">' : '') + '</td></tr>'; }).join('') + '</table></div>';
    // Rueckmeldung + Fragenbank
    const rm = ein('rueckmeldung')[0];
    if (rm) {
      const fragen = String(rm.daten.fragen || '').split(/\n+/).map(s => s.trim()).filter(Boolean);
      html += '<div class="karte"><b>Rückmeldung nach dem Audit</b><p>Auditor: ' + esc((L.AUDITOR_TYPEN[rm.daten.typ] || {}).name || '–') + '</p>'
        + (fragen.length ? '<p><b>Fragen aus dem echten Audit</b></p><ol>' + fragen.map(f => '<li>' + esc(f) + '</li>').join('') + '</ol><button class="knopf" data-csv="' + encodeURIComponent(JSON.stringify(fragen)) + '">Fragenbank (CSV) herunterladen</button>' : '')
        + ['gut', 'schwer', 'fest'].map(k => rm.daten[k] ? '<p><b>' + ({ gut: 'Gut', schwer: 'Schwer', fest: 'Feststellungen' }[k]) + ':</b> ' + esc(rm.daten[k]) + '</p>' : '').join('') + '</div>';
    }
    if ((e.nachweise || []).length) html += '<div class="karte"><b>Übungsfotos</b><br>' + e.nachweise.filter(n => n.bild).map(n => '<img class="mini" title="' + esc(n.notiz) + '" src="' + n.bild + '">').join('') + '</div>';
    return html;
  }).join('');
  document.querySelectorAll('[data-csv]').forEach(b => b.onclick = () => {
    const fragen = JSON.parse(decodeURIComponent(b.dataset.csv)); const a0 = paket.audits[0] || {};
    const csv = 'zertifizierer;norm;stufe;frage;quelle\n' + fragen.map(f => [a0.zertifizierer || '', a0.normen || '', a0.stufe || '', f, 'Rückmeldung'].map(x => '"' + String(x).replace(/"/g, '""') + '"').join(';')).join('\n');
    const l = document.createElement('a'); l.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); l.download = 'Fragenbank_' + new Date().toISOString().slice(0, 10) + '.csv'; l.click();
  });
}
</script>
</body>
</html>
