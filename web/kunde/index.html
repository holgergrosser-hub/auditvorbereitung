<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Auditvorbereitung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--f:#1F4E79;--f-hell:#EEF4FA;--blau:#1F4E79;--blau2:#2E6DA4;--hell:#EEF4FA;--rand:#D5E1EC;--text:#1B2733;--grau:#5B6B7A;--gruen:#2B8A3E;--gelb:#E0A800;--rot:#C92A2A}
*{box-sizing:border-box}
body{margin:0;font-family:"Public Sans",system-ui,sans-serif;color:var(--text);background:#F6F9FC;font-size:16px;line-height:1.5}
header{background:var(--blau);color:#fff;padding:14px 16px}
header .firma{font-size:1.45rem;font-weight:700}
header .info{opacity:.9;font-size:.95rem}
.kopfzeile{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.reife{display:inline-block;background:#fff;color:var(--blau);font-weight:700;border-radius:99px;padding:4px 12px;font-size:.95rem}
.teilen-leiste{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))!important;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#B42318;color:#fff;padding:6px 16px;font-size:.92rem}.teilen-leiste .knopf{background:#fff;color:#B42318}
.ki-antwort{border-left:4px solid #D9480F}.ki-antwort .eyebrow{color:#D9480F}.so-sagen{background:#FFF4E6;border-radius:8px;padding:6px 10px}
.senden-leiste{border:2px solid var(--blau);background:#EEF4FF}
.pa-raster{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:start}@media (max-width:820px){.pa-raster{grid-template-columns:1fr}}
.pa-log{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 10px}
.pa-msg{max-width:85%;border-radius:12px;padding:8px 12px;background:var(--hell)}.pa-msg.ich{align-self:flex-end;background:#E3FAFC}.pa-msg.au{align-self:flex-start}
.pa-wer{font-size:.78rem;font-weight:700;color:var(--grau);margin-bottom:2px}.pa-hoer{font-size:.8rem}
#pa-text{width:100%;margin:8px 0}.pa-hilfen{margin-top:6px}#pa-mic.an{background:#C92A2A;color:#fff;border-color:#C92A2A}
.pa-themen{margin:8px 0 0;padding-left:20px;font-size:.92rem}.pa-themen li{margin:4px 0;color:var(--grau)}.pa-themen li.jetzt{color:var(--text);font-weight:700}.pa-themen li.fertig{text-decoration:line-through}
.pa-einst{flex-wrap:wrap;gap:14px}
.vorgabe{background:var(--hell);border-radius:8px;padding:8px 10px;margin:6px 0;display:grid;gap:4px;font-size:.93rem}.etikett-klein{display:inline-block;min-width:104px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--f,#0B7285)}
.vorgabe-gross{border-left:6px solid var(--f,#0B7285)}
.fuss{max-width:1100px;margin:28px auto 96px;padding:0 16px;color:var(--grau);font-size:.85rem;text-align:center;line-height:1.7}.fuss a{color:inherit}
.spick-fuss{margin-top:8px;font-size:.8rem;color:var(--grau);text-align:right}
.karte.marke-karte{border-left:6px solid var(--f,#E0A800)}
.wahl[hidden]{display:none!important}
.eigen-wahl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:12px 0}
.eigen-karte{display:flex;flex-direction:column;gap:6px;text-align:left;background:#fff;border:1px solid var(--rand);border-top:6px solid var(--f);border-radius:14px;padding:16px;font:inherit;color:inherit;cursor:pointer}
.eigen-karte b{font-size:1.15rem;color:var(--f)}.eigen-karte:hover{box-shadow:0 6px 16px rgba(20,40,60,.12)}
.eigen-schutz{border-left:6px solid #6741D9;background:#F3F0FF}
.test-karte{border-left:6px solid #E0A800;background:#FFF8E1}.fb-note{display:inline-flex;gap:4px;align-items:center;margin-right:10px;font-weight:400}
.kopf-senden{margin-left:8px;background:#fff;color:var(--blau);border:0;border-radius:99px;padding:5px 14px;font-weight:700;font-size:.95rem;cursor:pointer}.kopf-senden:hover{background:#E7F0FF}
.senden-panel textarea{width:100%;margin:6px 0;font:inherit;padding:8px;border:1px solid var(--rand);border-radius:8px;box-sizing:border-box}
.reife.bereit{background:#D3F9D8;color:#1B5E20}.reife.fast{background:#FFF3BF;color:#7A5A00}
.zeile{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.wahl{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--hell);border-bottom:1px solid var(--rand)}
select,button,textarea,input{font:inherit}
select,input{padding:7px 9px;border:1px solid var(--rand);border-radius:8px;background:#fff;max-width:100%}
#nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:#fff;border-bottom:1px solid var(--rand);position:sticky;top:0;z-index:5}
#nav button{border:0;background:none;padding:8px 12px;border-radius:8px;color:var(--grau);font-weight:600;white-space:nowrap;cursor:pointer}
#nav button{display:inline-flex;align-items:center;gap:6px}
#nav .punkt{width:8px;height:8px;border-radius:50%;background:var(--f);flex:none}
#nav button.an{background:var(--f);color:#fff}#nav button.an .punkt{background:#fff}
#brot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:920px;margin:0 auto;padding:12px 16px 0;font-size:.92rem}
.brot-gruppe{background:var(--f-hell);color:var(--f);font-weight:700;border-radius:99px;padding:1px 10px}
#nav .ok{color:var(--gruen)}#nav button.an .ok{color:#B7F0C4}#nav .zahl{font-weight:400;opacity:.8}
main{max-width:920px;margin:0 auto;padding:16px}
h2{color:var(--f);margin:6px 0 10px;font-size:1.3rem}
h3{margin:18px 0 8px;font-size:1.05rem;color:var(--f)}
label{display:block;margin:6px 0}
.zeile label{display:inline-block;margin:0}
.karte{background:#fff;border:1px solid var(--rand);border-radius:12px;padding:14px;margin:10px 0}
.karte.gut{border-color:#9FD3B0;background:#F3FBF5}
.knopf{display:inline-block;border:0;border-radius:8px;padding:9px 14px;background:var(--f);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
.knopf.zweit{background:#fff;color:var(--f);border:1px solid var(--f)}
.knopf.gruen{background:var(--gruen)}.knopf.rot{background:var(--rot)}.knopf.klein{padding:5px 10px;font-size:.9rem}
.knopf:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--blau2);text-decoration:underline;cursor:pointer;padding:0}
.hinweis{background:#FFF8E1;border:1px solid #F2D58A;border-radius:10px;padding:10px 12px;margin:10px 0}
.ok-box{background:#E7F5EC;border:1px solid #9FD3B0;border-radius:10px;padding:10px 12px;margin:10px 0}
.ruhe{background:#E7F5EC;border:1px solid #9FD3B0;border-radius:12px;padding:16px;margin:10px 0;font-size:1.05rem}
.grau{color:var(--grau);font-size:.92rem}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--hell);color:var(--blau);font-size:.8rem;font-weight:600;margin-right:4px}
.chip.grau{color:var(--grau)}.chip.faellig{background:#FFE3E3;color:var(--rot)}.chip.bald{background:#FFF3BF;color:#7A5A00}.chip.ok{background:#D3F9D8;color:#1B5E20}
.np{display:inline-block;min-width:44px;font-weight:700;color:var(--blau)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:#CBD5E0;vertical-align:middle;flex:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dot.klein{width:9px;height:9px;margin-right:3px}
.dot.gruen{background:var(--gruen)}.dot.gelb{background:var(--gelb)}.dot.rot{background:var(--rot)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--rand)}
.check:last-child{border-bottom:0}
.haken{width:28px;height:28px;border-radius:50%;border:2px solid var(--rand);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;color:#fff}
.haken.ja{background:var(--gruen);border-color:var(--gruen)}
.frage{display:flex;gap:10px;align-items:flex-start}.frage .text{flex:1}
.hilfe{background:var(--hell);border-radius:8px;padding:10px;margin-top:8px}
.auszug{background:#fff;border:1px solid var(--rand);border-left:4px solid var(--blau2);border-radius:8px;padding:8px 10px;margin:8px 0}
.auszug-text{font-size:.93rem;max-height:220px;overflow:auto;margin-top:4px}
mark{background:#FFE066;padding:0 1px}
.doks{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.legende{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--grau);margin:6px 0}
textarea{width:100%;min-height:70px;padding:8px;border:1px solid var(--rand);border-radius:8px}
.uhr{font-size:3rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;color:var(--blau)}
.uhr.klein{font-size:1.2rem;margin-left:auto}.uhr.vorbei{color:var(--rot)}
#trainer{position:fixed;inset:0;background:rgba(15,30,45,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#trainer .box{background:#fff;border-radius:14px;max-width:680px;width:100%;padding:18px;max-height:94vh;overflow:auto}
video.vorschau{width:100%;max-height:200px;background:#000;border-radius:8px}
.foto-wahl{display:flex;flex-direction:column;gap:10px}.foto-weg{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center}.foto-weg .knopf{text-align:center}.fw-kbd{cursor:default}kbd{border:1px solid var(--rand);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:inherit;font-size:.85em;background:#fff}
@media (max-width:640px){.foto-weg{grid-template-columns:1fr}}
img.foto{max-width:100%;border:1px solid var(--rand);border-radius:8px}
img.mini{max-width:160px;max-height:110px;border:1px solid var(--rand);border-radius:6px;margin-top:6px}
.pruef.ja{color:var(--gruen);font-weight:600}.pruef.nein{color:var(--rot);font-weight:600}.pruef.teilweise{color:#9A6B00;font-weight:600}
.balken{height:10px;background:var(--rand);border-radius:99px;overflow:hidden;display:flex;flex:1}
.balken span{display:block;height:100%}
.teil{display:grid;grid-template-columns:150px 1fr 50px;gap:10px;align-items:center;margin:6px 0;font-size:.95rem}
.lek{display:grid;grid-template-columns:18px 44px 1fr;gap:6px;align-items:start;margin:6px 0}.lek .dot{margin-top:5px}
.weiter{cursor:pointer;color:var(--blau2);padding:4px 0}
.typen{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:10px 0}
.typ{border:1px solid var(--rand);border-radius:10px;padding:8px;cursor:pointer;margin:0}
.typ.an{border-color:var(--blau);background:var(--hell)}.typ input{margin-right:6px}.typ span{display:block}
.karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.lernkarte{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:10px}
.lernkarte .vorne{font-weight:700;color:var(--blau);cursor:pointer}.lernkarte.kann{border-color:#9FD3B0;background:#F3FBF5}
.lernkarte .hinten{margin-top:6px;font-size:.93rem}
.option{display:block;padding:4px 0;cursor:pointer}.erkl{background:var(--hell);border-radius:8px;padding:8px;margin-top:6px}
.spick-dok{margin:4px 0}.spick-p{white-space:nowrap}
.knopf.zweit.an{background:var(--hell);border-width:2px}
.ursache{margin-top:10px;border-top:1px dashed var(--rand);padding-top:8px}
.bau-gruppe{margin:10px 0}.bau{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--hell)}
.prozesse{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.prozess{text-align:left;background:#fff;border:1px solid var(--rand);border-radius:8px;padding:8px;cursor:pointer;font:inherit}
.prozess.gut{border-color:#9FD3B0;background:#F3FBF5}.prozess.teil{border-color:#F2D58A;background:#FFFBEB}
.az-azubi{background:var(--hell);border-radius:10px 10px 10px 2px;padding:8px 10px;margin:8px 40px 4px 0}
.az-chef{background:#E7F5EC;border-radius:10px 10px 2px 10px;padding:8px 10px;margin:4px 0 8px 40px}
@media (max-width:640px){.bau{grid-template-columns:36px 1fr}.bau>:last-child{grid-column:1/-1}}
/* Übersicht: Hero (Termin, Reife, nächster Schritt) + farbige Bereiche mit Kacheln */
.hero{display:grid;grid-template-columns:1fr 1.1fr 1.2fr;gap:12px;margin:4px 0 8px}
.hero-feld{background:#fff;border:1px solid var(--rand);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left;font:inherit;color:inherit}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--grau);font-weight:700}
.gross{font-size:2.6rem;font-weight:700;line-height:1.05;color:var(--blau);font-variant-numeric:tabular-nums}.gross small{font-size:1rem;font-weight:600;margin-left:4px;color:var(--grau)}
.hero-reife{flex-direction:row;align-items:center;gap:12px}.ring{width:84px;height:84px;flex:none}
.hero-weiter{cursor:pointer;background:var(--f);border-color:var(--f);color:#fff}.hero-weiter .eyebrow,.hero-weiter .grau{color:rgba(255,255,255,.85)}
.hero-weiter:hover{filter:brightness(1.08)}.hero-weiter.fertig{background:#E7F5EC;border-color:#9FD3B0;color:var(--text);cursor:default}.hero-weiter.fertig .eyebrow{color:var(--grau)}
.weiter-titel{font-size:1.25rem}
.stufe-erkl summary,.reife-teile summary{cursor:pointer;color:var(--blau2);font-size:.9rem}.stufe-erkl p{margin:6px 0;font-size:.92rem}
.reife-teile .teil{grid-template-columns:110px 1fr 40px;font-size:.85rem}
.gruppen{display:flex;flex-wrap:wrap;gap:18px 26px;margin-top:18px}
.gruppe{flex:0 1 calc(var(--n) * 196px + (var(--n) - 1) * 10px);min-width:0}
.gruppe .kacheln{grid-template-columns:repeat(var(--n),minmax(0,1fr))}
main.breit{max-width:1080px}.hero-termin .link{align-self:flex-start;text-align:left}
.gruppe-titel{display:flex;align-items:center;gap:8px;color:var(--f);margin:0 0 8px;font-size:1.05rem}.gruppe-titel.neutral{color:var(--text);margin-top:22px}
.gruppe-nr{width:24px;height:24px;border-radius:50%;background:var(--f);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.kachel{position:relative;display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;color:var(--text);background:#fff;border:1px solid var(--rand);border-top:4px solid var(--f);border-radius:14px;padding:12px 14px 14px;cursor:pointer;min-width:0;transition:transform .12s,box-shadow .12s}
.kachel:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,40,60,.12)}.kachel:focus-visible,.hero-weiter:focus-visible{outline:3px solid var(--f);outline-offset:2px}
.kachel.fertig{background:var(--f-hell)}
.k-icon{width:36px;height:36px;border-radius:10px;background:var(--f-hell);display:flex;align-items:center;justify-content:center;font-size:1.15rem;margin-bottom:4px}
.k-titel{font-weight:700;color:var(--f);font-size:1.02rem}.k-ok{color:var(--gruen)}
.k-text{font-size:.86rem;color:var(--grau);line-height:1.35}
.k-status{font-size:.86rem;font-weight:600;margin-top:auto;padding-top:6px}
.mini-balken{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--rand);margin-top:4px}
.mini-balken span{display:block;height:100%}.mini-balken .voll{background:var(--f)}.mini-balken .gruen{background:var(--gruen)}.mini-balken .gelb{background:var(--gelb)}.mini-balken .rot{background:var(--rot)}.mini-balken .offen{background:var(--rand)}
details.aufklapp summary{cursor:pointer}details.aufklapp .karte{border:0;padding:0;margin:6px 0 0}
@media (max-width:760px){.hero{grid-template-columns:1fr}.gruppe{flex-basis:100%}.gruppe .kacheln{grid-template-columns:1fr 1fr}}
@media (max-width:340px){.gruppe .kacheln{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.kachel{transition:none}.kachel:hover{transform:none}}

.stufen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.stufe{background:#fff;border:1px solid var(--rand);border-radius:12px;padding:12px;opacity:.75}
.stufe.jetzt{opacity:1;border:2px solid var(--blau);background:var(--hell)}.jetzt-marke{color:var(--blau);font-weight:600;margin-top:4px}
.wegweiser .weiter{padding:5px 0;border-bottom:1px solid var(--hell);color:inherit}.wegweiser .weiter b{color:var(--blau2)}
.erkl-kurz{background:var(--hell);border-radius:8px;padding:8px 10px;font-size:.95rem}
h3.schritt{margin-top:20px;padding-top:10px;border-top:2px solid var(--rand)}
.block .zeit{font-weight:700;color:var(--blau);min-width:100px}.fund{align-items:center}.fund>span:nth-child(2){flex:1}
.spick-kopf{font-size:1.05rem;margin-bottom:6px}.spick-box{background:var(--hell);border-radius:8px;padding:8px 10px;margin:8px 0}
.spick-block{margin:10px 0}.spick-zeit{break-after:avoid}table.spick tr{break-inside:avoid}
.fund-zeile{border-bottom:1px solid var(--hell);padding:4px 0}.fund-zeile details{margin:0 0 6px 30px;font-size:.92rem}.fund-zeile summary{cursor:pointer;color:var(--blau2)}.spick-zeit{border-bottom:2px solid var(--blau);padding-bottom:2px;margin-bottom:4px}
table.spick td.np{width:46px;font-weight:700;color:var(--blau)}
table.spick a{color:var(--blau2)}@media print{table.spick a{color:inherit;text-decoration:none}}
@media (max-width:640px){.stufen{grid-template-columns:1fr}}
.nur-druck{display:none}
@media (max-width:640px){.teil{grid-template-columns:110px 1fr 40px}header .firma{font-size:1.2rem}}
@media print{header,nav,.wahl,.kein-druck,#trainer,.ruhe{display:none!important}.spick-box{background:#f2f2f2}body{background:#fff;font-size:10pt}main{padding:0;max-width:none}.karte{border:0;padding:0;margin:4px 0}.nur-druck{display:block}h2{font-size:13pt}h3{font-size:10.5pt;margin:7px 0 3px}.spick-dok{font-size:9pt}}

/* Tawuniya-Lehren (E-A26): eine kräftige Hauptkarte, sonst ruhig; Etiketten statt farbiger Flächen; Schnellzugriffe; untere Leiste am Handy */
.hero2{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin:4px 0 10px}
.haupt-karte{background:var(--f);color:#fff;border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 22px rgba(15,40,60,.16)}
.haupt-karte .eyebrow{color:rgba(255,255,255,.82)}
.hk-termin{display:flex;flex-direction:column;gap:2px}.hk-tage{font-size:2rem;font-weight:700;line-height:1.1}.hk-datum{opacity:.9}
.hk-weiter{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;background:#fff;color:var(--text);border:0;border-radius:14px;padding:12px 44px 12px 14px;cursor:pointer}
.hk-weiter .eyebrow{color:var(--f)}.hk-weiter b{font-size:1.1rem}.hk-weiter.fertig{cursor:default}
.hk-pfeil{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--f);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.hk-weiter:hover{box-shadow:0 0 0 3px rgba(255,255,255,.5)}.hk-weiter:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hk-danach{font-size:.88rem;opacity:.9}
.schnell{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:#fff;border:1px solid var(--rand);border-radius:18px;padding:12px 8px;margin:0 0 6px}
.schnell button{min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font:inherit;font-size:.86rem;color:var(--text);cursor:pointer;padding:4px;border-radius:12px;text-align:center}
.schnell .rund{width:50px;height:50px;border-radius:50%;background:#F1F4F7;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.schnell button:hover .rund{background:#E4EAF0}.schnell button:focus-visible{outline:3px solid var(--blau2)}
.gruppe-titel{display:inline-flex;align-items:center;gap:6px;background:var(--f-hell);color:var(--f);border-radius:99px;padding:3px 12px 3px 4px;font-size:.92rem}
.gruppe-titel .gruppe-nr{width:22px;height:22px;font-size:.78rem}
.kachel{border-top:1px solid var(--rand)}.kachel:hover{border-color:var(--f)}
.abschnitt{display:block;background:#fff;border:1px solid var(--rand);border-radius:18px;padding:14px 16px;margin:12px 0}
.etikett{display:inline-flex;align-items:center;gap:4px;background:var(--f-hell);color:var(--f);font-weight:700;font-size:.82rem;border-radius:99px;padding:3px 11px}
.abschnitt .satz,.abschnitt h3.satz{font-size:1.05rem;font-weight:600;color:var(--text);margin:8px 0 4px}
details.abschnitt summary{list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}details.abschnitt summary::-webkit-details-marker{display:none}
details.abschnitt summary .satz{margin:0}.chevron{margin-left:auto;color:var(--grau);transition:transform .15s}details[open] .chevron{transform:rotate(180deg)}
.mini-ring{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;color:var(--grau);font-weight:600}.mini-ring svg{width:22px;height:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip-knopf{border:1px solid var(--rand);background:#fff;border-radius:99px;padding:5px 12px;font:inherit;font-size:.9rem;cursor:pointer;color:var(--text)}
.chip-knopf.an{background:var(--f);border-color:var(--f);color:#fff}.chip-knopf .anz{opacity:.75;font-variant-numeric:tabular-nums}
.wo-finde summary{color:var(--blau2)}.wo-finde p{margin:4px 0;font-size:.9rem}
.unten{display:none}
.mehr-blatt{position:fixed;inset:0;background:rgba(15,30,45,.45);z-index:30;display:flex;align-items:flex-end}
.mehr-blatt[hidden]{display:none!important}
.blatt-innen{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;max-height:80vh;overflow:auto}
.blatt-ziel{display:flex;align-items:center;gap:10px;text-align:left;font:inherit;font-weight:600;background:#F6F9FC;border:0;border-radius:12px;padding:12px;cursor:pointer;color:var(--text)}
.blatt-ziel .punkt{width:10px;height:10px;border-radius:50%;background:var(--f)}
@media (max-width:760px){.hero2{grid-template-columns:1fr}.schnell{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:700px){
  nav#nav{display:none!important}
  .unten{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--rand);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .unten[hidden]{display:none!important}
  .unten button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;font:inherit;font-size:.72rem;color:var(--grau);padding:4px 6px;border-radius:10px;cursor:pointer;flex:1}
  .unten button span{font-size:1.25rem;line-height:1}
  .unten button.an{color:var(--f);font-weight:700;background:var(--f-hell)}
  body{padding-bottom:76px}
  .teilen-leiste{bottom:64px}
}
@media print{.unten,.schnell,.mehr-blatt{display:none!important}}
</style>
</head>
<body>
<header>
  <div class="kopfzeile"><div class="firma" id="firma">Auditvorbereitung</div><div id="reife"></div></div>
  <div class="info" id="audit-info">Wird geladen …</div>
  <div class="info" id="modus"></div>
</header>
<div class="wahl kein-druck" id="wahl" hidden>
  <label>Audit <select id="sel-audit"></select></label>
  <label>Wer übt? <select id="sel-ma"></select></label>
</div>
<nav id="nav" hidden></nav>
<div id="brot" class="kein-druck" hidden></div>
<div id="mehr-blatt" class="mehr-blatt kein-druck" hidden></div>
<nav id="unten" class="unten kein-druck" hidden aria-label="Hauptnavigation"></nav>
<main id="main"><p class="grau">Einen Moment …</p></main>
<footer id="fuss" class="fuss kein-druck"></footer>
<div id="trainer"><div class="box" id="trainer-box"></div></div>
<script src="../config.js"></script>
<script type="module" src="./seite.js"></script>
</body>
</html>
